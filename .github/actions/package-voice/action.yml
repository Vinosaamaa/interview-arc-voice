name: Validate and package Interview Arc Voice
description: Run the canonical Voice audit, tests, signing policy, and package build.

runs:
  using: composite
  steps:
    - name: Show Xcode toolchain
      shell: bash
      run: xcodebuild -version && swift --version
    - name: Audit public-safe tracked content
      shell: bash
      run: ./scripts/audit-public-safety.sh
    - name: Test artifact promotion policy
      shell: bash
      run: Tests/ArtifactPromotionPolicyTests.sh
    - name: Test Engineering impact policy
      shell: bash
      run: python3 Tests/EngineeringImpactPolicyTests.py
    - name: Test
      shell: bash
      run: swift test
    - name: Validate signing policy
      shell: bash
      run: Tests/SigningPolicyTests.sh
    - name: Package app
      shell: bash
      run: ./scripts/package-app.sh
