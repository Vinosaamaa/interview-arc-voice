name: Validate Interview Arc Voice

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Interview-Arc-Voice
          path: dist/Interview Arc Voice.app
